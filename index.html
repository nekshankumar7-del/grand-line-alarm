<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Night Sentinel — the alarm that only stops when you complete your morning missions." />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Night Sentinel" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Night Sentinel</title>
    <style>
      /* Launch splash: shown instantly by the HTML (before any JS), faded out once the app is ready. */
      html, body { margin: 0; background: #020617; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 40%, #1e293b 0%, #0b1026 45%, #020617 100%);
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .mark { width: 96px; height: 96px; animation: splash-pop 0.9s cubic-bezier(0.16, 1, 0.3, 1) both, splash-glow 2.4s ease-in-out 0.9s infinite; }
      #splash .name {
        margin-top: 18px; color: #fde68a; font: 600 13px/1 system-ui, sans-serif; letter-spacing: 0.45em; text-transform: uppercase; text-align: center;
        opacity: 0; animation: splash-fade 0.6s ease 0.35s forwards;
      }
      #splash .bar { margin: 18px auto 0; width: 120px; height: 3px; border-radius: 3px; background: rgb(255 255 255 / 0.1); overflow: hidden; }
      #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #f59e0b; animation: splash-load 1.1s ease-in-out infinite; }
      @keyframes splash-pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splash-glow { 50% { filter: drop-shadow(0 0 18px rgb(245 158 11 / 0.65)); } }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #splash .mark, #splash .name, #splash .bar::after { animation: none; opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div>
        <svg class="mark" viewBox="0 0 100 100">
          <path d="M62 8 A44 44 0 1 0 92 70 A36 36 0 1 1 62 8Z" fill="#f59e0b" />
          <path d="M22 52 Q50 28 78 52 Q50 76 22 52Z" fill="#f59e0b" />
          <path d="M28 52 Q50 34 72 52 Q50 70 28 52Z" fill="none" stroke="#020617" stroke-width="3" />
          <circle cx="50" cy="52" r="9" fill="#020617" />
          <circle cx="50" cy="52" r="4.5" fill="#f59e0b" />
        </svg>
        <div class="name">Night Sentinel</div>
        <div class="bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
